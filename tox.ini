[tox]
skipsdist = True
envlist = py312

[testenv]
# Dependencies are managed by Poetry (single source of truth). Install them into
# the tox environment via Poetry instead of pipenv, which required a git-ignored
# Pipfile that is absent in CI. This keeps tox usable for future multi-version runs.
allowlist_externals =
    poetry
    rm
commands_pre =
    poetry install --no-root --with dev
commands =
    poetry run pytest tests -vv --doctest-modules --cov=. --junitxml=tests-reports/junit.xml --cov-report=xml:tests-reports/coverage.xml --cov-report=html:tests-reports/html --cov-report=term
# Remove the whole environment to avoid leaving cruft on CI agents and locally.
# Deleting the FULL {envdir} (not a partial bin/lib subset) is what prevents the
# stale half-provisioned state that broke consecutive runs before.
commands_post =
    rm -rf {envdir}
